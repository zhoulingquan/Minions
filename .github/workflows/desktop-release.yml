# Build Minions Desktop:
# - Legacy desktop: Windows (conda-pack + NSIS), macOS (conda-pack -> .app)
# Runs on release publish and manual dispatch.

name: Minions Desktop Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_oss:
        description: 'Upload to OSS'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # On release events, fail fast if the DashScope secret is missing.
  # Without it, the verifier would silently skip the LLM chat round
  # and emit a misleading "PASS". Forks / manual dispatch are allowed
  # to run without the secret (UI-load checks still execute).
  check-release-secrets:
    name: Check release secrets (release only)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure DashScope secret is configured
        env:
          MINIONS_DASHSCOPE_API_KEY: ${{ secrets.MINIONS_DASHSCOPE_API_KEY }}
        run: |
          if [ -z "$MINIONS_DASHSCOPE_API_KEY" ]; then
            echo "::error::MINIONS_DASHSCOPE_API_KEY is not set; release verification cannot validate the LLM chat round. Configure the repo secret before publishing."
            exit 1
          fi
          echo "DashScope secret present"

  build-windows:
    needs: [check-release-secrets]
    # Keep the legacy desktop packaging code in place, but do not build it.
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          activate-environment: "minions-build"
          condarc-file: .github/condarc
          conda-remove-defaults: false

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2

      - name: Clean dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item -Recurse -Force dist
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null

      - name: Build Windows installer
        shell: pwsh
        run: conda run -n minions-build pwsh -File ./scripts/pack/build_win.ps1

      - name: List dist (on failure)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== dist contents ==="
          Get-ChildItem -Path dist -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
          if (Test-Path dist\win-unpacked) {
            Write-Host "=== dist\win-unpacked (first 30) ==="
            Get-ChildItem -Path dist\win-unpacked -ErrorAction SilentlyContinue | Select-Object -First 30 | ForEach-Object { $_.Name }
          }

      - name: Set up runner Python for verification
        id: runner-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify desktop (Legacy Windows)
        timeout-minutes: 10
        uses: ./.github/actions/verify-legacy-windows
        with:
          dashscope-api-key: ${{ secrets.MINIONS_DASHSCOPE_API_KEY }}
          version: ${{ steps.version.outputs.version }}
          runner-python: ${{ steps.runner-python.outputs.python-path }}

      - name: Stop desktop server (Legacy Windows)
        if: always()
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP "minions-desktop.pid"
          if (Test-Path $pidFile) {
            $pidValue = (Get-Content $pidFile | Select-Object -First 1).Trim()
            if ($pidValue) {
              taskkill /F /PID $pidValue 2>$null | Out-Null
            }
          }

          # Best-effort port-based fallback (kill anything still on 8088).
          $line = netstat -ano 2>$null | Select-String -Pattern ':8088 .*LISTENING' |
            Select-Object -First 1
          if ($line) {
            $owner = ($line.ToString() -split '\s+')[-1].Trim()
            if ($owner) { taskkill /F /PID $owner 2>$null | Out-Null }
          }

          # Uninstall to leave the runner clean.
          $installDir = Join-Path $env:RUNNER_TEMP "Minions-Verify"
          $uninstaller = Join-Path $installDir "Uninstall.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait `
              -ErrorAction SilentlyContinue
          }
          exit 0

      - name: Upload desktop verify logs (Legacy Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-legacy-windows-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/minions-desktop-stdout.log
            ${{ runner.temp }}/minions-desktop-stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Legacy Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-legacy-windows-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minions-Desktop-Windows-${{ steps.version.outputs.version }}
          path: dist/Minions-Setup-*.exe

  build-macos:
    needs: [check-release-secrets]
    # Keep the legacy desktop packaging code in place, but do not build it.
    if: ${{ false }}
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        uses: ./.github/actions/get-version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.11"
          activate-environment: "minions-build"
          condarc-file: .github/condarc
          conda-remove-defaults: false

      - name: Clean dist directory
        run: rm -rf dist && mkdir -p dist

      - name: Build macOS .app
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          chmod +x scripts/pack/build_macos.sh
          conda run -n minions-build bash -c 'CREATE_ZIP=1 ./scripts/pack/build_macos.sh'

      - name: Set up runner Python for verification
        id: runner-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify desktop (Legacy macOS)
        timeout-minutes: 10
        uses: ./.github/actions/verify-legacy-macos
        with:
          dashscope-api-key: ${{ secrets.MINIONS_DASHSCOPE_API_KEY }}
          version: ${{ steps.version.outputs.version }}
          runner-python: ${{ steps.runner-python.outputs.python-path }}

      - name: Stop desktop server (Legacy macOS)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/minions-desktop.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/minions-desktop.pid")" 2>/dev/null || true
          fi
          lsof -ti:8088 | xargs kill 2>/dev/null || true
          rm -rf dist/verify-legacy

      - name: Upload desktop verify logs (Legacy macOS)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-logs-legacy-macos-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/minions-desktop-stdout.log
            ${{ runner.temp }}/minions-desktop-stderr.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload verify screenshots (Legacy macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-verify-screenshots-legacy-macos-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/verify-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minions-Desktop-macOS-${{ steps.version.outputs.version }}
          path: dist/Minions-*.zip
