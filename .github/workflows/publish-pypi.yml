# Publish all Minions Python distributions to PyPI when a release is created.
# Build includes console/docs resources in minions-app.
# Manual trigger: can optionally force push to PyPI or just upload artifacts.
# Release trigger: publishes to PyPI.
#
# Pipeline: build 14 distributions → verify → publish components → publish meta.

name: Publish Python Package to PyPI

on:
  workflow_dispatch:
    inputs:
      force_push_to_pypi:
        description: 'Force push to PyPI (even without release)'
        required: false
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ── Stage 1: Build and validate all workspace artifacts ───────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (for console build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        run: |
          cd console && npm ci && npm run build

      - name: Copy console build into package
        run: |
          rm -rf packages/minions-app/src/minions/console/*
          mkdir -p packages/minions-app/src/minions/console
          cp -R console/dist/* packages/minions-app/src/minions/console/

      - name: Bundle docs into package
        run: |
          rm -rf packages/minions-app/src/minions/docs
          mkdir -p packages/minions-app/src/minions/docs
          cp website/public/docs/*.md packages/minions-app/src/minions/docs/

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build twine

      - name: Build workspace
        run: python scripts/build_workspace.py

      - name: Validate all release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          artifacts = tuple(sorted(Path("dist").iterdir()))
          wheels = tuple(path for path in artifacts if path.suffix == ".whl")
          sdists = tuple(path for path in artifacts if path.name.endswith(".tar.gz"))
          if len(wheels) != 14 or len(sdists) != 14:
              raise SystemExit(
                  f"expected 14 wheels and 14 sdists, found {len(wheels)} and {len(sdists)}"
              )
          # Equivalent to `twine check` without a platform-dependent shell glob.
          subprocess.run(
              [sys.executable, "-m", "twine", "check", *(str(path) for path in artifacts)],
              check=True,
          )
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minions-dist
          path: dist/
          retention-days: 30

      - name: Upload version metadata
        uses: actions/upload-artifact@v4
        with:
          name: minions-version
          path: packages/minions-core/src/minions/__version__.py
          retention-days: 30

  # ── Stage 2: Verify installation ───────────────────────────────────────────
  verify:
    needs: [build]
    uses: ./.github/workflows/release-verify.yml
    with:
      verify_pip: true
      verify_script_install: true

  # ── Stage 3: Publish to PyPI ───────────────────────────────────────────────
  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_push_to_pypi == 'true')
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: minions-dist
          path: dist

      - name: Prepare ordered release directories
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          artifacts = tuple(sorted(Path("dist").iterdir()))
          component_dir = Path("release-artifacts/components")
          meta_dir = Path("release-artifacts/meta")
          component_dir.mkdir(parents=True)
          meta_dir.mkdir(parents=True)
          for artifact in artifacts:
              destination = meta_dir if re.match(r"^minions-\d", artifact.name) else component_dir
              shutil.copy2(artifact, destination / artifact.name)
          components = tuple(component_dir.iterdir())
          meta = tuple(meta_dir.iterdir())
          if len(components) != 26 or len(meta) != 2:
              raise SystemExit(
                  f"expected 26 component artifacts and 2 meta artifacts, "
                  f"found {len(components)} and {len(meta)}"
              )
          PY

      - name: Confirm component projects are provisioned
        run: |
          echo "All 13 minions-* component projects must already exist on PyPI."
          echo "A missing project will fail the component upload before the meta package is published."

      - name: Publish component distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: release-artifacts/components

      - name: Publish meta distribution
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: release-artifacts/meta
