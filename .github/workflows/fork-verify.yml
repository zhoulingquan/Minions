# One-click release verification for fork repositories.
# Builds the workspace artifacts, then runs all verification jobs.
#
# Docker uses public base images (node:20-slim, ghcr.io/astral-sh/uv) instead of
# the private ACR registry, so forks can validate the full pipeline without credentials.
#
# Usage: trigger manually via Actions → Fork Release Verification → Run workflow.

name: Fork Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Build workspace (same steps as publish-pypi.yml build job) ─────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (for console build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        run: |
          cd console && npm ci && npm run build

      - name: Copy console build into package
        run: |
          rm -rf packages/minions-app/src/minions/console/*
          mkdir -p packages/minions-app/src/minions/console
          cp -R console/dist/* packages/minions-app/src/minions/console/

      - name: Bundle docs into package
        run: |
          rm -rf packages/minions-app/src/minions/docs
          mkdir -p packages/minions-app/src/minions/docs
          cp website/public/docs/*.md packages/minions-app/src/minions/docs/

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build twine

      - name: Build and validate workspace artifacts
        run: |
          python scripts/build_workspace.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          artifacts = tuple(sorted(Path("dist").iterdir()))
          wheels = tuple(path for path in artifacts if path.suffix == ".whl")
          sdists = tuple(path for path in artifacts if path.name.endswith(".tar.gz"))
          if len(wheels) != 14 or len(sdists) != 14:
              raise SystemExit(
                  f"expected 14 wheels and 14 sdists, found {len(wheels)} and {len(sdists)}"
              )
          subprocess.run(
              [sys.executable, "-m", "twine", "check", *(str(path) for path in artifacts)],
              check=True,
          )
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minions-dist
          path: dist/
          retention-days: 7

      - name: Upload version metadata
        uses: actions/upload-artifact@v4
        with:
          name: minions-version
          path: packages/minions-core/src/minions/__version__.py
          retention-days: 7

  # ── Run all verification jobs ──────────────────────────────────────────────
  verify:
    needs: [build]
    uses: ./.github/workflows/release-verify.yml
    with:
      verify_pip: true
      verify_docker: true
      verify_script_install: true
      docker_node_image: "node:20-slim"
      docker_uv_image: "ghcr.io/astral-sh/uv:latest"
