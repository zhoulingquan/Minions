[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minions"
version = "0.1.0"
description = "A personal assistant that runs in your own environment."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "minions-core==0.1.0",
    "minions-runtime==0.1.0",
    "minions-providers==0.1.0",
    "minions-tool-calls==0.1.0",
    "minions-drivers==0.1.0",
    "minions-channels==0.1.0",
    "minions-plugins==0.1.0",
    "minions-loop==0.1.0",
    "minions-governance==0.1.0",
    "minions-modes==0.1.0",
    "minions-agents==0.1.0",
    "minions-app==0.1.0",
    "minions-cli==0.1.0",
]

[project.urls]
Homepage = "https://minions.agentscope.io/"
Repository = "https://github.com/agentscope-ai/Minions"
Documentation = "https://minions.agentscope.io/docs/"
Issues = "https://github.com/agentscope-ai/Minions/issues"

[project.scripts]
minions = "minions.cli.main:cli"

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.2.1",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.0.0",
    "import-linter>=2.13,<3",
    "build>=1.2,<2",
    "twine>=6,<7",
]
dev = ["pre-commit>=4.2.0"]
postgres = [
    "minions-agents[postgres]==0.1.0",
    "minions-app[postgres]==0.1.0",
]
local = ["minions-providers[local]==0.1.0"]
whisper = ["minions-agents[whisper]==0.1.0"]
skills = [
    "minions-agents[documents,pdf,presentations,spreadsheets]==0.1.0",
]
full = [
    "minions-providers[local]==0.1.0",
    "minions-agents[documents,pdf,presentations,spreadsheets,whisper]==0.1.0",
]

[tool.setuptools]
packages = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
minions-core = { workspace = true }
minions-runtime = { workspace = true }
minions-providers = { workspace = true }
minions-tool-calls = { workspace = true }
minions-drivers = { workspace = true }
minions-channels = { workspace = true }
minions-plugins = { workspace = true }
minions-loop = { workspace = true }
minions-governance = { workspace = true }
minions-modes = { workspace = true }
minions-agents = { workspace = true }
minions-app = { workspace = true }
minions-cli = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "p0: critical user flows (messaging, CRUD, global config, security); PR smoke gate",
    "p1: supported features (settings, scoped overrides, helpers); nightly regression",
    "p2: error paths, 404 handling, validation, contracts, metadata",
    "unit: marks tests as unit tests",
    "contract: marks tests as contract tests",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["minions"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*"]

[tool.coverage.paths]
source = ["packages/*/src/minions"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
fail_under = 30
show_missing = true

[tool.coverage.html]
directory = "htmlcov"
