[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minions-channels"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "minions-core==0.1.0",
    "minions-runtime==0.1.0",
    "minions-providers==0.1.0",
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",
    "certifi>=2024.0.0",
    "dingtalk-stream>=0.24.3",
    "lark-oapi>=1.5.3",
    "alibabacloud-dingtalk>=2.2.42",
    "alibabacloud-tea-openapi>=0.4.4",
    "alibabacloud-credentials>=0.3.0",
    "alibabacloud-tea-util>=0.3.0",
    "wecom-aibot-python-sdk==1.0.2",
    "pycryptodome>=3.20.0",
    "websocket-client>=1.8.0",
    "pillow>=10.0.0",
    "cryptography>=43.0.0",
    "protobuf>=5.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["minions", "minions.channels*"]
namespaces = true

[tool.setuptools.package-data]
"minions" = ["channels/yuanbao/proto/**"]
