[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minions-app"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "minions-core==0.1.0",
    "minions-runtime==0.1.0",
    "minions-providers==0.1.0",
    "minions-tool-calls==0.1.0",
    "minions-drivers==0.1.0",
    "minions-channels==0.1.0",
    "minions-plugins==0.1.0",
    "minions-governance==0.1.0",
    "minions-loop==0.1.0",
    "minions-modes==0.1.0",
    "minions-agents==0.1.0",
    "agentscope==2.0.4",
    "pydantic>=2.0,<3",
    "fastapi>=0.110,<1",
    "starlette>=0.36,<1",
    "apscheduler>=3.11.2,<4",
    "aiofiles>=24.1.0",
    "orjson>=3.9",
    "watchfiles>=0.22",
    "httpx>=0.27.0",
    "segno>=1.6.6",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2,<4"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "minions",
    "minions.app*",
    "minions.backup*",
    "minions.agent_stats*",
    "minions.tenancy*",
    "minions.tunnel*",
]
namespaces = true

[tool.setuptools.package-data]
"minions" = ["console/**", "docs/*.md", "tenancy/migrations/*.sql"]
