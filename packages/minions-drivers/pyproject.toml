[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minions-drivers"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "minions-core==0.1.0",
    "agentscope==2.0.4",
    "mcp>=1.13.0,<2.0.0",
    "anyio>=4.0.0,<4.13.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["minions", "minions.drivers*"]
namespaces = true
