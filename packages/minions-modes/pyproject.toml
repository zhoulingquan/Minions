[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minions-modes"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "minions-core==0.1.0",
    "minions-runtime==0.1.0",
    "minions-loop==0.1.0",
    "minions-governance==0.1.0",
    "agentscope==2.0.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["minions", "minions.modes*"]
namespaces = true
