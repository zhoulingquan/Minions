[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minions-agents"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "minions-core==0.1.0",
    "minions-runtime==0.1.0",
    "minions-providers==0.1.0",
    "minions-tool-calls==0.1.0",
    "minions-drivers==0.1.0",
    "minions-plugins==0.1.0",
    "minions-loop==0.1.0",
    "minions-governance==0.1.0",
    "minions-modes==0.1.0",
    "agentscope==2.0.4",
    "agent-client-protocol>=0.9.0,<0.11.0",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
    "aiofiles>=24.1.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "playwright>=1.49.0",
    "mss>=9.0.0",
    "openai>=2.0.0,<=2.33.0",
]

[project.optional-dependencies]
whisper = ["openai-whisper>=20231117"]
documents = ["defusedxml>=0.7.1", "lxml>=5.0.0"]
pdf = [
    "pillow>=10.0.0",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
]
presentations = ["lxml>=5.0.0", "pillow>=10.0.0"]
spreadsheets = ["lxml>=5.0.0", "openpyxl>=3.1.0"]
postgres = ["psycopg[binary,pool]>=3.2,<4"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "minions",
    "minions.agents*",
    "minions.market*",
    "minions.sage*",
]
namespaces = true

[tool.setuptools.package-data]
"minions" = [
    "agents/md_files/**",
    "agents/skills/**",
    "sage/migrations/*.sql",
]

[tool.setuptools.exclude-package-data]
"*" = [
    "**/__pycache__/**",
    "**.pyc",
    "**.pyo",
]
