[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minions-core"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0.0",
    "shortuuid>=1.0.0",
    "json-repair>=0.30.0",
    "pyyaml>=6.0",
    "keyring>=25.0.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "tzdata>=2024.1",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "minions",
    "minions.core*",
    "minions.config*",
    "minions.security*",
    "minions.envs*",
    "minions.observability*",
    "minions.utils*",
]
namespaces = true

[tool.setuptools.package-data]
"minions" = [
    "security/tool_guard/rules/**",
    "security/skill_scanner/rules/**",
    "security/skill_scanner/data/**",
]
