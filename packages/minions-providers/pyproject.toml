[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minions-providers"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "minions-core==0.1.0",
    "agentscope==2.0.4",
    "pydantic>=2.0,<3",
    "httpx>=0.27.0",
    "openai>=2.0.0,<=2.33.0",
    "anthropic>=0.40.0",
    "google-genai>=1.67.0",
    "huggingface-hub>=0.20.0",
    "modelscope>=1.35.0",
    "transformers>=4.30.0",
    "onnxruntime<1.24",
]

[project.optional-dependencies]
local = ["huggingface-hub>=0.20.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["minions", "minions.providers*", "minions.local_models*"]
namespaces = true
