[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minions-cli"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "minions-core==0.1.0",
    "minions-runtime==0.1.0",
    "minions-providers==0.1.0",
    "minions-channels==0.1.0",
    "minions-plugins==0.1.0",
    "minions-agents==0.1.0",
    "minions-app==0.1.0",
    "agentscope==2.0.4",
    "click>=8.1,<9",
    "textual>=8.2.8",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.40.0",
    "pywebview>=4.0",
    "psutil>=6.0.0",
    "packaging>=24.0",
    "questionary>=2.1.1",
    "agent-client-protocol>=0.9.0,<0.11.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["minions", "minions.cli*"]
namespaces = true
