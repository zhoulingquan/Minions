allows = ["minions-core", "minions-runtime", "minions-providers", "minions-tool-calls", "minions-drivers", "minions-channels", "minions-plugins", "minions-governance", "minions-loop", "minions-agents", "minions-modes"]

[workspace]
active_packages = ["minions"]
