[packages.minions-core]
imports = ["minions.core", "minions.config", "minions.security", "minions.envs", "minions.observability", "minions.utils", "minions.constant", "minions.exceptions", "minions.schemas", "minions.__version__"]
allows = []

[packages.minions-tool-calls]
imports = ["minions.tool_calls"]
allows = []

[packages.minions-runtime]
imports = ["minions.runtime", "minions.token_usage", "minions.hooks"]
allows = ["minions-core"]

[packages.minions-providers]
imports = ["minions.providers", "minions.local_models"]
allows = ["minions-core"]

[packages.minions-drivers]
imports = ["minions.drivers"]
allows = ["minions-core"]

[packages.minions-channels]
imports = ["minions.channels"]
allows = ["minions-core", "minions-runtime", "minions-providers"]

[packages.minions-plugins]
imports = ["minions.plugins", "minions._version_compat"]
allows = ["minions-core", "minions-runtime", "minions-channels"]

[packages.minions-governance]
imports = ["minions.governance", "minions.sandbox"]
allows = ["minions-core", "minions-drivers"]

[packages.minions-loop]
imports = ["minions.loop"]
allows = ["minions-core", "minions-runtime"]

[packages.minions-agents]
imports = ["minions.agents", "minions.market", "minions.sage"]
allows = ["minions-core", "minions-runtime", "minions-providers", "minions-tool-calls", "minions-drivers", "minions-plugins", "minions-loop", "minions-governance", "minions-modes"]

[packages.minions-modes]
imports = ["minions.modes"]
allows = ["minions-core", "minions-runtime", "minions-loop", "minions-governance"]

[packages.minions-app]
imports = ["minions.app", "minions.backup", "minions.agent_stats", "minions.tenancy", "minions.tunnel", "minions.api_action"]
allows = ["minions-core", "minions-runtime", "minions-providers", "minions-tool-calls", "minions-drivers", "minions-channels", "minions-plugins", "minions-governance", "minions-loop", "minions-agents", "minions-modes"]

[packages.minions-cli]
imports = ["minions.cli", "minions.__main__"]
allows = ["minions-core", "minions-runtime", "minions-providers", "minions-channels", "minions-plugins", "minions-agents", "minions-app"]

[packages.minions]
imports = []
allows = ["minions-core", "minions-runtime", "minions-providers", "minions-tool-calls", "minions-drivers", "minions-channels", "minions-plugins", "minions-loop", "minions-governance", "minions-modes", "minions-agents", "minions-app", "minions-cli"]

[workspace]
active_packages = [
    "minions-core",
    "minions-runtime",
    "minions-providers",
    "minions-tool-calls",
    "minions-drivers",
    "minions-channels",
    "minions-plugins",
    "minions-loop",
    "minions-governance",
    "minions-modes",
    "minions-agents",
    "minions-app",
    "minions-cli",
]
