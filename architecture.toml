[packages.minions-core]
imports = ["minions.core"]
allows = []

[packages.minions-tool-calls]
imports = ["minions.tool_calls"]
allows = []

[packages.minions-runtime]
imports = ["minions.runtime"]
allows = ["minions-core", "minions-tool-calls"]

[packages.minions-providers]
imports = ["minions.providers", "minions.local_models"]
allows = ["minions-core"]

[packages.minions-drivers]
imports = ["minions.drivers"]
allows = ["minions-core"]

[packages.minions-channels]
imports = ["minions.channels"]
allows = ["minions-core"]

[packages.minions-plugins]
imports = ["minions.plugins"]
allows = ["minions-core", "minions-runtime"]

[packages.minions-governance]
imports = ["minions.governance", "minions.security", "minions.sandbox"]
allows = ["minions-core"]

[packages.minions-loop]
imports = ["minions.loop"]
allows = ["minions-core"]

[packages.minions-agents]
imports = ["minions.agents"]
allows = ["minions-core", "minions-runtime", "minions-providers", "minions-tool-calls", "minions-drivers", "minions-plugins", "minions-governance"]

[packages.minions-modes]
imports = ["minions.modes"]
