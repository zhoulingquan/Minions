version: '3.8'

volumes:
  minions-data:
    name: minions-data
  minions-secrets:
    name: minions-secrets
  minions-backups:
    name: minions-backups

services:
  minions:
    image: agentscope/minions:latest
    init: true
    container_name: minions
    restart: always
    ports:
      - "127.0.0.1:8088:8088"
    # environment:
    #   - MINIONS_AUTH_ENABLED=true
    #   - MINIONS_AUTH_USERNAME=admin
    #   - MINIONS_AUTH_PASSWORD=yourpassword
    volumes:
      - minions-data:/app/working
      - minions-secrets:/app/working.secret
      - minions-backups:/app/working.backups
